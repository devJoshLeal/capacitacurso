version: '3.8'
services:
  web:
    build: .
    container_name: capacitacurso
    ports: ["8080:80"]
    volumes: [".:/var/www/html"]
    depends_on: [db]
  db:
    image: mysql:8.0
    container_name: ci_mysql_db
    environment:
      MYSQL_DATABASE: ci_database
      MYSQL_ROOT_PASSWORD: root_password
    volumes: [mysql_data:/var/lib/mysql]
volumes:
  mysql_data:
